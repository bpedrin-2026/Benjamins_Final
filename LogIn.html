<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Login Page</title>

    <!--  ---------- Contains own styling and js to keep it isolated -------------     -->

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        header {
            text-align: center;
        }

        .login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .message {
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <p style="color:red"><strong>There Are Many Options,<br>
                                        But One Option Is NEVER An Option!</strong></p>
    </header>

    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" autofocus>
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="message" id="message"></div>
    </div>

    <script>
        // Multiple valid username-password pairs
        const validUsers = [
            { username: "benjamin", password: "#Education2026!" },
            { username: "admin", password: "password" },
            { username: "SoftwareSystems", password: "123456789" }
        ];

        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const messageDiv = document.getElementById("message");

            // Input validation
            if (!user || !pass) {
                messageDiv.style.color = "red";
                messageDiv.textContent = "Please enter both username and password.";
                return;
            }

            // Check credentials
            const found = validUsers.some(u => u.username === user && u.password === pass);

            if (found) {
                messageDiv.style.color = "green";
                messageDiv.textContent = "Login successful!";
                window.open("pages/Index1.html", "_self");
            } else {
                messageDiv.style.color = "red";
                messageDiv.textContent = "Invalid username or password.";
            }
        }
    </script>

</body>

</html>
